# Enable debug logging for security troubleshooting
logging.level.com.example.socialbackend.security=INFO
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Demo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:vishal}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${APP_JWT_SECRET:replace_this_with_a_long_random_secret_key_must_be_>=_32_chars}
app.jwt.exp-ms=3600000

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Enable additional debug endpoints when 'APP_DEBUG=true' is set in env
app.debug=false

server.address=0.0.0.0

# CORS: comma-separated allowed origins for dev, mobile webview & native Capacitor
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,capacitor://localhost,http://10.0.2.2:8080,http://172.24.50.1:8080}

# Auth cookie settings
app.cookie.same-site=${APP_COOKIE_SAMESITE:Lax}
app.cookie.secure=${APP_COOKIE_SECURE:false}

# Upload configuration
app.upload.dir=uploads
app.upload.max-size=104857600

# Servlet Multipart configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# OTP Authentication Mode (set APP_DEV_MODE=false in production to send OTP directly to mobile phones)
app.dev-mode=${APP_DEV_MODE:true}


