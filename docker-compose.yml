version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: socialdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=socialdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - APP_JWT_SECRET=dev-secret-2026-please-change-this-xxxxxxxxxxxxxx
      - APP_DEBUG=true
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  db-data:
